<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIS — لوحة القيادة التنفيذية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F2;--panel:#fff;--ink:#12231E;--muted:#5B6B65;--line:#DCE2DD;--soft:#EEF1EE;--thbg:#FAFBFA;--head:#12231E;
--green:#0F6B53;--blue:#3A5F82;--amber:#C98200;--red:#B3261E;--gray:#B8BDB9;--chipbg:#EFEFEA;
--goodbg:#DDEFE8;--goodfg:#0B5A44;--badbg:#F8DFDC;--badfg:#8E1B14;--medbg:#FBEBC8;--medfg:#7A5200;--lowbg:#E7ECEF;--lowfg:#34495E;--segon:#12231E;--segfg:#fff}
:root[data-theme="dark"]{color-scheme:dark;--paper:#0D1613;--panel:#15231E;--ink:#E7EFEB;--muted:#9AAEA5;--line:#2A3C36;--soft:#1F302A;--thbg:#1A2B25;--head:#09100E;
--green:#3FB68B;--blue:#6FA3D1;--amber:#E3A83C;--red:#F0726A;--gray:#53645E;--chipbg:#22342D;
--goodbg:#15402F;--goodfg:#7FE0B8;--badbg:#4A2220;--badfg:#FFA9A2;--medbg:#4A3A12;--medfg:#F2CB74;--lowbg:#26363F;--lowfg:#B7CAD6;--segon:#3FB68B;--segfg:#06130E}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{background:var(--head);color:#fff;padding:22px 0 20px}
header.top .wrap{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
header.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:0}
header.top p{margin:4px 0 0;color:#B9C9C2;font-size:14px}
.langbtn{background:transparent;border:1px solid #4C6A60;color:#fff;border-radius:4px;padding:6px 14px;cursor:pointer}
.langbtn:hover{background:#1E3A31}
.hbtns{display:flex;gap:8px}
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.filters select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:130px;font-size:14px}
.filters .reset{margin-inline-start:auto;background:none;border:none;color:var(--green);cursor:pointer;text-decoration:underline;font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
main{padding:20px 0 40px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 2px;font-size:16px;font-weight:600}
.panel .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.g21{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px}
.kl{font-size:13px;color:var(--muted)}
.kv{font-size:28px;font-weight:600;line-height:1.25;margin-top:2px}
.ks{font-size:12.5px;color:var(--muted);margin-top:2px}
.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-green{color:var(--green)}
.bk .r{display:grid;grid-template-columns:8.6rem minmax(40px,1fr) 4.6rem 3.7rem;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--soft);font-size:14px}
.bk .r:last-child{border-bottom:none}
.bk .hd{color:var(--muted);font-size:12px;padding-top:0}
.track{height:10px;background:var(--soft);border-radius:2px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--green)}
.chip{font-size:12.5px;text-align:center;border-radius:3px;padding:1px 4px;background:var(--chipbg)}
.chip.good{background:var(--goodbg);color:var(--goodfg)}.chip.bad{background:var(--badbg);color:var(--badfg)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{padding:2px 12px 2px 0;border-inline-start:3px solid var(--line);padding-inline-start:12px;padding-inline-end:0;font-size:14.5px}
.ins li.red{border-color:var(--red)}.ins li.amber{border-color:var(--amber)}.ins li.green{border-color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
svg text{font-family:inherit}
.cols{display:flex;align-items:flex-end;gap:4px;height:170px;min-width:520px;padding-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .b{width:70%;background:var(--blue);border-radius:2px 2px 0 0;min-height:1px}
.cols .l{font-size:10.5px;color:var(--muted);margin-top:4px;direction:ltr}
.cols .v{font-size:11px;color:var(--ink);direction:ltr}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--soft);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--thbg);position:sticky;top:0}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--ink)}
td.n,th.n{text-align:end}
.st{display:inline-flex;align-items:center;gap:6px}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block}
.badge{font-size:12px;border-radius:3px;padding:1px 6px;background:var(--badbg);color:var(--badfg)}
.search{border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:240px;background:var(--panel)}
.gantt{direction:ltr;position:relative;font-size:12.5px}
.gantt .row{display:grid;grid-template-columns:150px 1fr;align-items:center;height:26px}
.gantt .lab{padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.gantt .tr{position:relative;height:100%;border-left:1px solid var(--line)}
.gantt .bar2{position:absolute;top:6px;height:14px;border-radius:2px}
.gantt .ref{position:absolute;top:0;bottom:0;border-left:2px dashed var(--red)}
.gantt .axis{display:grid;grid-template-columns:150px 1fr;color:var(--muted);font-size:11.5px}
.gantt .axis div.t{position:relative;height:18px}
.gantt .axis span{position:absolute;transform:translateX(-50%)}
.hc{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--soft)}
.hc:last-child{border-bottom:none}
.sev{font-size:12.5px;font-weight:600;border-radius:3px;text-align:center;height:fit-content;padding:2px 4px}
.sev.high{background:var(--badbg);color:var(--badfg)}.sev.med{background:var(--medbg);color:var(--medfg)}.sev.low{background:var(--lowbg);color:var(--lowfg)}.sev.pass{background:var(--goodbg);color:var(--goodfg)}
.hc h4{margin:0;font-size:15px;font-weight:600}
.hc p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.hc code{direction:ltr;unicode-bidi:isolate;display:block;margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12.5px;white-space:pre-wrap;font-family:Consolas,monospace;text-align:left}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-size:34px;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding:14px 0 30px}
footer ul{margin:6px 0 0;padding-inline-start:18px}
#tip{position:fixed;z-index:50;background:var(--head);border:1px solid var(--line);color:#fff;border-radius:4px;padding:6px 9px;font-size:13px;pointer-events:none;display:none;max-width:260px;line-height:1.45}
.empty{padding:40px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:5px 12px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--segon);color:var(--segfg)}
.row-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
</style>
</head>

 let g='';for(let i=0;i<=4;i++){const v=ymn+(ymx-ymn)*i/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v*100)}%</text>`}
 for(let v=0;v<=1.6e6;v+=4e5){g+=`<text x="${X(v)}" y="${H-b+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${(v/1e6).toFixed(1)}</text>`}

 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr">${g}<line x1="${l}" x2="${W-r}" y1="${ay}" y2="${ay}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${W-r}" y="${ay-5}" text-anchor="end" font-size="11" fill="var(--ink)">${L('متوسط المحفظة ','Portfolio avg ')}${pct(all)}</text>${dots}<text x="${(l+W-r)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--muted)">${L('إيراد المشروع (مليون)','Project revenue (M)')}</text><text x="12" y="${t+4}" font-size="12" fill="var(--muted)">${L('الهامش','Margin')}</text></svg>`}

function execView(){

 const open=P.filter(p=>p.Status!=='Completed'),od=P.filter(p=>p.overdue);const comp=sum(P.filter(p=>p.Status==='Completed'),p=>p.Revenue);
 const byC=agg(P,p=>p.ClientID),top3=sum(byC.slice(0,3),o=>o.rev)/rev;
 const mgs=P.map(p=>p.margin);
 const cnt=s=>P.filter(p=>p.Status===s).length;
 const bySv=agg(P,p=>p.service),byRg=agg(P,p=>p.region),bySc=agg(P,p=>p.sector);
 const ins=[];

  ins.push([tr.k!==tm.k?'amber':'green',tr.k!==tm.k?L(`${nm('service',tr.k)} الأعلى إيراداً (${M(tr.rev)}) لكن ${nm('service',tm.k)} الأعلى هامشاً (${pct(tm.mg)}). الإيراد الأكبر ليس هو الربح الأكبر.`,`${nm('service',tr.k)} leads revenue (${M(tr.rev)}) but ${nm('service',tm.k)} leads margin (${pct(tm.mg)}). Biggest revenue is not biggest profit.`):L(`${nm('service',tr.k)} يتصدر الإيراد والهامش معاً.`,`${nm('service',tr.k)} leads on both revenue and margin.`)]);
  if(lm.k!==tm.k)ins.push(['red',L(`${nm('service',lm.k)} الأدنى هامشاً (${pct(lm.mg)}) — راجع التسعير وهيكل التكلفة.`,`${nm('service',lm.k)} has the lowest margin (${pct(lm.mg)}) — review pricing and cost structure.`)])}
 if(byRg.length>1)ins.push(['green',L(`${nm('region',byRg[0].k)} الأعلى إيراداً (${M(byRg[0].rev)}) بهامش ${pct(byRg[0].mg)}.`,`${nm('region',byRg[0].k)} leads revenue (${M(byRg[0].rev)}) at ${pct(byRg[0].mg)} margin.`)]);
 if(bySc.length>1){const w=[...bySc].sort((a,b)=>a.mg-b.mg)[0];ins.push(['red',L(`قطاع ${nm('sector',w.k)} الأضعف ربحية (${pct(w.mg)}).`,`${nm('sector',w.k)} is the weakest sector (${pct(w.mg)} margin).`)])}
 if(hold.length)ins.push(['amber',L(`${hold.length} مشاريع معلّقة تمثل ${pct(hr/rev)} من الإيراد (${M(hr)}) — قيمة عقود لم تتحقق بعد.`,`${hold.length} on-hold projects hold ${pct(hr/rev)} of revenue (${M(hr)}) — contract value not yet realised.`)]);
 if(od.length)ins.push(['red',L(`${od.length} من ${open.length} مشاريع غير مكتملة تجاوزت تاريخ انتهائها المخطط (أقدمها ${Math.max(...od.map(p=>p.late))} يوماً).`,`${od.length} of ${open.length} unfinished projects are past planned end date (oldest ${Math.max(...od.map(p=>p.late))} days).`)]);
 if(byC.length>3)ins.push([top3>.5?'amber':'green',L(`أكبر 3 عملاء = ${pct(top3)} من الإيراد.`,`Top 3 clients = ${pct(top3)} of revenue.`)]);
 return `<div class="kpis">

  ${kpi(L('إيراد محقق (مكتمل)','Realised (completed)'),M(comp),L(`${pct(comp/rev)} من قيمة العقود`,`${pct(comp/rev)} of contract value`),'green')}
  ${kpi(L('الربح','Profit'),M(prof),L('التكلفة ','Cost ')+M(cost))}
  ${kpi(L('هامش الربح','Profit margin'),pct(mg),L(`بين ${pct(Math.min(...mgs))} و${pct(Math.max(...mgs))} للمشروع`,`${pct(Math.min(...mgs))} – ${pct(Math.max(...mgs))} per project`))}
  ${kpi(L('إيراد معلّق','On-hold revenue'),M(hr),L(`${pct(hr/rev)} من الإيراد · ${hold.length} مشاريع`,`${pct(hr/rev)} of revenue · ${hold.length} projects`),hold.length?'amber':'')}
  ${kpi(L('مشاريع متجاوزة موعدها','Projects past due'),`${od.length}/${open.length}`,L('غير مكتملة وتاريخها المخطط مضى','unfinished, planned end passed'),od.length?'red':'green')}
  ${kpi(L('تركّز أكبر 3 عملاء','Top-3 client share'),pct(top3),L('من إجمالي الإيراد','of total revenue'),top3>.5?'amber':'')}
 </div>
 <div class="g21">
  <div class="panel"><h3>${L('خريطة المحفظة: أين يقع الربح وأين يقع الخطر؟','Portfolio map: where profit and risk sit')}</h3><p class="sub">${L('كل نقطة مشروع. المحور الأفقي حجم العقد، والعمودي الهامش. الإطار الأحمر = متجاوز موعده. اضغط على نقطة لفتح تفاصيلها.','Each dot is a project: size on X, margin on Y. Red ring = past due. Click a dot for details.')}</p>
   <div class="legend">${Object.keys(SC).map(k=>`<span><i style="background:${SC[k]}"></i>${nm('status',k)} (${cnt(k)})</span>`).join('')}</div>${scatter(P)}</div>
  <div class="panel"><h3>${L('ما الذي تقوله الأرقام','What the numbers say')}</h3><p class="sub">${L('تُحدَّث تلقائياً مع الفلاتر','Updates with the filters')}</p><ul class="ins">${ins.map(i=>`<li class="${i[0]}">${i[1]}</li>`).join('')}</ul></div>

  <div class="panel"><h3>${L('أكبر العملاء','Top clients')}</h3><p class="sub">${L('بين القوسين عدد المشاريع','Project count in brackets')}</p>${breakdown(P,p=>p.ClientID,k=>cn(cl[k].ClientName),8)}</div>

 let c=0;const series=ms.map(([y,m])=>{const o=by.get(mk(y,m))||{v:0,n:0};c+=o.v;return{label:ml(y,m),v:o.v,c,n:o.n}});

 const yrs=[];for(let y=g0.getFullYear();y<=g1.getFullYear();y++)for(const m of [0,3,6,9]){const d=new Date(y,m,1);if(d>=g0&&d<=g1)yrs.push(`<span style="left:${pos(d)}%">${ml(y,m)}</span>`)}
 return `<div class="panel"><div class="row-h"><div><h3>${L('الإيراد الشهري والتراكمي','Monthly and cumulative revenue')}</h3><p class="sub">${L('يُنسب كامل قيمة المشروع إلى شهر واحد؛ اختر الأساس. (الأعمدة = الشهر، الخط = التراكمي، المحور الأيمن بالمليون)','Full project value is booked in a single month; choose the basis. (Bars = month, line = cumulative, right axis in M)')}</p></div>

  <div class="legend">${Object.keys(SC).map(k=>`<span><i style="background:${SC[k]}"></i>${nm('status',k)}</span>`).join('')}</div>

 return P.map(p=>`<tr><td>${p.ProjectID}</td><td>${cn(cl[p.ClientID].ClientName)}</td><td>${nm('service',p.service)}</td><td><span class="st"><i style="background:${SC[p.Status]}"></i>${nm('status',p.Status)}</span></td><td class="num">${dstr(p.ed)}</td><td class="n num">${N(p.Revenue)}</td><td class="n num">${N(p.profit)}</td><td class="n"><span class="chip num ${p.margin<.2?'bad':p.margin>.35?'good':''}">${pct(p.margin)}</span></td><td>${p.overdue?`<span class="badge num">${L('متأخر '+p.late+' يوم',p.late+'d overdue')}</span>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">${L('لا نتائج','No results')}</td></tr>`}
function projView(){
 const H=[['ProjectID',L('المشروع','Project')],['client',L('العميل','Client')],['service',L('الخدمة','Service')],['Status',L('الحالة','Status')],['ed',L('الانتهاء المخطط','Planned end')],['Revenue',L('الإيراد','Revenue'),1],['profit',L('الربح','Profit'),1],['margin',L('الهامش','Margin'),1],['late',L('التأخر','Overdue')]];
 return `<div class="panel"><div class="row-h" style="margin-bottom:10px"><div><h3>${L('سجل المشاريع','Project register')}</h3><p class="sub" style="margin:0">${L('اضغط على العنوان للترتيب','Click a header to sort')}</p></div><input class="search" data-q placeholder="${L('ابحث: مشروع، عميل، خدمة…','Search project, client, service…')}" value="${esc(S.q)}"></div>
 <div class="scroll"><table><thead><tr>${H.map(h=>`<th data-sort="${h[0]}" class="${h[2]?'n':''}">${h[1]}${S.sort===h[0]?(S.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody id="pbody">${projRows()}</tbody></table></div></div>`}

function checks(){
 const T=D.tickets,P=D.projects,A=D.assets,C=D.clients;
 const openClosed=T.filter(t=>t.Status==='Open'&&(t.ClosedDate||t.hours!=null)).length,openN=T.filter(t=>t.Status==='Open').length;
 const mism=T.filter(t=>t.ClientID!==pj[t.ProjectID].ClientID).length;
 const outside=T.filter(t=>t.cd<pj[t.ProjectID].sd||t.cd>pj[t.ProjectID].ed).length;
 const od=P.filter(p=>p.overdue).length,opn=P.filter(p=>p.Status!=='Completed').length;
 const ret=A.filter(a=>a.Status==='Retired'),noProj=C.filter(c=>!P.some(p=>p.ClientID===c.ClientID));
 const holdRev=sum(P.filter(p=>p.Status==='On Hold'),p=>p.Revenue);
 const orph=P.filter(p=>!cl[p.ClientID]||!sv[p.ServiceID]).length+T.filter(t=>!cl[t.ClientID]||!pj[t.ProjectID]).length+A.filter(a=>!cl[a.ClientID]).length;
 const dup=['clients:ClientID','projects:ProjectID','tickets:TicketID','assets:AssetID'].reduce((s,x)=>{const[t,k]=x.split(':');return s+D[t].length-new Set(D[t].map(r=>r[k])).size},0);
 const nulls=['clients','services','projects','tickets','assets'].reduce((s,t)=>s+D[t].reduce((z,r)=>z+Object.values(r).filter(v=>v===''||v==null).length,0),0);
 const badDates=P.filter(p=>p.ed<p.sd||p.Cost>p.Revenue).length+T.filter(t=>new Date(t.ClosedDate)<new Date(t.CreatedDate)).length;
 return [
 {sev:openClosed?'high':'pass',t:L('تذاكر "مفتوحة" لها تاريخ إغلاق','"Open" tickets carry a closed date'),f:`${openClosed}/${openN}`,why:L('كل التذاكر المفتوحة لها ClosedDate وساعات حل — حالة التذكرة وتاريخ إغلاقها متناقضان، فتصبح مؤشرات المفتوح/المغلق وSLA غير موثوقة.','Every open ticket has a ClosedDate and resolution hours — status and dates contradict, so open/closed and SLA KPIs are unreliable.'),fix:`UPDATE Tickets SET ClosedDate = NULL, ResolutionHours = NULL\nWHERE Status = 'Open';   -- أو صحّح Status إلى Closed`},
 {sev:mism?'high':'pass',t:L('عميل التذكرة ≠ عميل المشروع','Ticket client ≠ project client'),f:`${mism}/${T.length}`,why:L('التذكرة تحمل ClientID وProjectID معاً وهما لا يتطابقان تقريباً دائماً. هذا يكسر النموذج: مسارا علاقة بين العميل والتذاكر ونتائج متضاربة حسب المسار.','Tickets hold both ClientID and ProjectID and they almost never agree. This breaks the model: two paths from client to tickets and conflicting results.'),fix:`-- احذف ClientID من Tickets واشتقّه عبر المشروع\nALTER TABLE Tickets DROP COLUMN ClientID;\n-- العميل = Projects.ClientID عبر ProjectID`},
 {sev:'high',t:L('مشاريع غير مكتملة تجاوزت تاريخ انتهائها','Unfinished projects past planned end'),f:`${od}/${opn}`,why:L('كل المشاريع النشطة والمعلّقة انتهى تاريخها المخطط. إما أن الحالة لم تُحدَّث أو أن المحفظة متأخرة بالكامل.','All active and on-hold projects are past their planned end. Either statuses are stale or the whole portfolio is late.'),fix:`SELECT ProjectID, Status, EndDate,\n  DATEDIFF(DAY, EndDate, GETDATE()) AS DaysLate\nFROM Projects\nWHERE Status <> 'Completed' AND EndDate < CAST(GETDATE() AS DATE);`},
 {sev:'med',t:L('تذاكر خارج الفترة الزمنية لمشروعها','Tickets outside their project window'),f:`${outside}/${T.length}`,why:L('تذاكر أُنشئت قبل بدء المشروع أو بعد انتهائه — غالباً ربط خاطئ بين التذكرة والمشروع.','Tickets created before project start or after its end — likely wrong ticket-to-project link.'),fix:`SELECT t.TicketID, t.CreatedDate, p.StartDate, p.EndDate\nFROM Tickets t JOIN Projects p ON p.ProjectID = t.ProjectID\nWHERE t.CreatedDate NOT BETWEEN p.StartDate AND p.EndDate;`},
 {sev:'med',t:L('الأصول خارج الخدمة ضمن القيمة الإجمالية','Retired assets inside total value'),f:`${ret.length}/${A.length}`,why:L(`قيمتها ${M(sum(ret,a=>a.value))}. إن كانت المقياس "قيمة الأصول" يشملها فهو يضخّم رأس المال العامل. اعتمد مقياسين: الإجمالي وقيد الخدمة.`,`Worth ${M(sum(ret,a=>a.value))}. If the "Assets Value" measure includes them it overstates working capital. Report both total and in-service.`),fix:`Assets Value (In Service) =\nCALCULATE ( SUM ( FactAssets[AssetValue] ),\n            FactAssets[Status] = "Active" )`},
 {sev:'med',t:L('الإيراد يشمل مشاريع معلّقة','Revenue includes on-hold projects'),f:M(holdRev),why:L('"الإيراد" هنا = قيمة العقد الكاملة بغض النظر عن الحالة. افصل: إيراد محقق (مكتمل) / قيد التنفيذ / معلّق، وإلا تُقرأ الأرقام كأنها محققة.','"Revenue" here = full contract value regardless of status. Split realised (completed) / in progress / on hold or numbers read as realised.'),fix:`Revenue Completed =\nCALCULATE ( [Revenue], FactProjects[Status] = "Completed" )`},
 {sev:'low',t:L('عميل بلا مشاريع','Client without projects'),f:`${noProj.length}`,why:L(noProj.map(c=>cn(c.ClientName)).join('، ')+' لديه أصول لكن لا مشاريع. فرصة مبيعات أو سجل غير نشط؟','Has assets but no projects. Sales opportunity or dormant record?'),fix:`SELECT c.* FROM Clients c\nLEFT JOIN Projects p ON p.ClientID = c.ClientID\nWHERE p.ProjectID IS NULL;`},
 {sev:'pass',t:L('مفاتيح فريدة (لا تكرار)','Unique keys (no duplicates)'),f:`${dup}`,why:L('اجتاز الفحص.','Passed.')},
 {sev:'pass',t:L('سلامة الربط (لا يتامى)','Referential integrity (no orphans)'),f:`${orph}`,why:L('اجتاز الفحص.','Passed.')},
 {sev:'pass',t:L('لا قيم فارغة','No empty values'),f:`${nulls}`,why:L('اجتاز الفحص.','Passed.')},
 {sev:'pass',t:L('منطق التواريخ والتكلفة','Date and cost logic'),f:`${badDates}`,why:L('لا مشروع ينتهي قبل أن يبدأ، ولا تكلفة أعلى من الإيراد، ولا تذكرة تُغلق قبل إنشائها.','No project ends before it starts, no cost above revenue, no ticket closed before created.')}];
}
function healthView(){
 const c=checks().map(x=>x.sev==='pass'&&x.fix?{...x,why:L('تم إصلاحه وتحقق منه (القيمة 0).','Fixed and verified (value 0).'),fix:''}:x),pass=c.filter(x=>x.sev==='pass').length,lab={high:L('حرج','High'),med:L('متوسط','Medium'),low:L('منخفض','Low'),pass:L('سليم','Pass')};
 return `<div class="panel"><div class="score"><b class="num">${pass}/${c.length}</b><span>${L('فحوصات سليمة. ما تبقى يتعلق بتعريف المقاييس وبجودة ربط التذاكر بالمشاريع.','checks passed. What remains concerns metric definitions and ticket-to-project linking quality.')}</span></div></div>
 <div class="panel">${c.map(x=>`<div class="hc"><div class="sev ${x.sev}">${lab[x.sev]}<div class="num" style="font-weight:500">${x.f}</div></div><div><h4>${x.t}</h4><p>${x.why}</p>${x.fix?`<code>${esc(x.fix)}</code>`:''}</div></div>`).join('')}</div>`}

// ---------- shell ----------
function render(){
 const dts=D.projects.flatMap(p=>[p.sd,p.ed]),mn=new Date(Math.min(...dts)),mx=new Date(Math.max(...dts));
 const f=(k,label,opts)=>`<label>${label}<select data-f="${k}"><option value="all">${L('الكل','All')}</option>${opts.map(o=>`<option value="${o}" ${S[k]===o?'selected':''}>${nm(k,o)}</option>`).join('')}</select></label>`;
 const tabs=[['exec',L('الملخص التنفيذي','Executive')],['trend',L('الإيراد والجدول الزمني','Revenue & timeline')],['ops',L('العمليات والدعم','Operations')],['assets',L('الأصول','Assets')],['proj',L('المشاريع','Projects')],['health',L('جودة البيانات','Data health')]];
 const views={exec:execView,trend:trendView,ops:opsView,assets:assetsView,proj:projView,health:healthView};
 const uniq=a=>[...new Set(a)];
 document.documentElement.setAttribute('data-theme',S.theme);document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 document.getElementById('app').innerHTML=`<header class="top"><div class="wrap"><div><h1>${L('لوحة القيادة التنفيذية — الأداء والعمليات والأصول','Executive dashboard — performance, operations and assets')}</h1><p>${L(`${D.projects.length} مشروعاً · ${D.tickets.length} تذكرة · ${D.assets.length} أصلاً · ${D.clients.length} عملاء · من ${ml(mn.getFullYear(),mn.getMonth())} إلى ${ml(mx.getFullYear(),mx.getMonth())}`,`${D.projects.length} projects · ${D.tickets.length} tickets · ${D.assets.length} assets · ${D.clients.length} clients · ${ml(mn.getFullYear(),mn.getMonth())} to ${ml(mx.getFullYear(),mx.getMonth())}`)}</p></div><div class="hbtns"><button class="langbtn" data-mode aria-label="theme">${S.theme==='dark'?L('☀ الوضع الفاتح','☀ Light mode'):L('☾ الوضع الداكن','☾ Dark mode')}</button><button class="langbtn" data-lang>${L('English','العربية')}</button></div></div></header>
 <div class="bar"><div class="wrap"><div class="filters">${f('region',L('المنطقة','Region'),uniq(D.clients.map(c=>c.Region)))}${f('sector',L('القطاع','Sector'),uniq(D.clients.map(c=>c.Sector)))}${f('service',L('الخدمة','Service'),D.services.map(s=>s.ServiceName))}${f('status',L('حالة المشروع','Project status'),['Active','On Hold','Completed'])}<button class="reset" data-reset>${L('إعادة ضبط','Reset')}</button></div>
 <nav class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav></div></div>
 <div class="wrap"><main>${views[S.tab]()}</main>
 <footer>${L('تعريفات وافتراضات','Definitions and assumptions')}<ul>
 <li>${L('الإيراد = قيمة العقد الكاملة لكل مشروع بغض النظر عن حالته. الهامش = (الإيراد − التكلفة) ÷ الإيراد.','Revenue = full contract value per project regardless of status. Margin = (Revenue − Cost) ÷ Revenue.')}</li>
 <li>${L('متجاوز الموعد = مشروع غير مكتمل وتاريخ انتهائه المخطط قبل 1 نوفمبر 2026.','Past due = unfinished project whose planned end is before 1 Nov 2026.')}</li>
 <li>${L('العملة غير محددة في الملفات؛ تُعرض الأرقام بوحدة العملة الأصلية (م = مليون). حدّد العملة قبل العرض الرسمي.','Currency is not specified in the source files; figures are shown in source units (M = million). Confirm the currency before presenting.')}</li>
 <li>${L('الفلاتر تُطبَّق على التذاكر عبر مشروعها (عميله وخدمته وحالته)، وعلى الأصول عبر عميلها فقط.','Filters reach tickets through their project (its client, service and status); assets via client only.')}</li></ul></footer></div>`;
}

// ---------- events ----------
const app=document.getElementById('app');
app.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-lang],[data-mode],[data-reset],[data-basis],[data-sort],[data-dot]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab}
 else if('lang' in t.dataset){S.lang=S.lang==='ar'?'en':'ar'}
 else if('mode' in t.dataset){S.theme=S.theme==='dark'?'light':'dark';try{localStorage.setItem('mis-theme',S.theme)}catch(e){}}
 else if('reset' in t.dataset){S.region=S.sector=S.service=S.status='all'}
 else if(t.dataset.basis){S.basis=t.dataset.basis}
 else if(t.dataset.sort){S.dir=S.sort===t.dataset.sort?-S.dir:1;S.sort=t.dataset.sort}
 else if(t.dataset.dot){S.q=t.dataset.dot;S.tab='proj';S.region=S.sector=S.service=S.status='all'}
 render();hideTip();if(t.dataset.tab||t.dataset.dot)window.scrollTo({top:0})});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){S[t.dataset.f]=t.value;render()}else if('sla' in t.dataset){S.sla=+t.value;render()}});
app.addEventListener('input',e=>{if('q' in e.target.dataset){S.q=e.target.value;document.getElementById('pbody').innerHTML=projRows()}});
const tp=document.getElementById('tip');
function hideTip(){tp.style.display='none'}
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){hideTip();return}
 tp.innerHTML=esc(t.dataset.tip).replace(/\n/g,'<br>');tp.style.display='block';
 const w=tp.offsetWidth,h=tp.offsetHeight;let x=e.clientX+14,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-12;tp.style.left=x+'px';tp.style.top=y+'px'});
document.addEventListener('mouseleave',hideTip);
render();
})();
</script>
</body>
</html>
